<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>浮梦</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: #f5f5f5; }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #999;
            font-size: 16px;
        }
        .loading .dot {
            animation: blink 1.4s infinite both;
        }
        .loading .dot:nth-child(2) { animation-delay: 0.2s; }
        .loading .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
        #sdk-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        浮梦正在苏醒<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
    <div id="sdk-container"></div>

    <!-- 方案1：扣子编程 WebSDK -->
    <script src="https://lf-cdn.coze.cn/obj/unpkg/latest/coze/web-sdk/dist/js-umd/index.min.js"></script>
    <script>
        try {
            cozeWebSDK.init({
                projectId: '7639233788865970182',
                refreshToken: () => 'pat_SFfNrsqAZcodFqD7ctzRkoYbL6DKWQmItCeAbaHyLO8zfLm1H5HkaanOgG6F08bL',
                container: document.getElementById('sdk-container'),
            });
            // 隐藏loading
            setTimeout(function() {
                document.getElementById('loading').style.display = 'none';
            }, 3000);
        } catch(e) {
            // 方案1失败，尝试 Iframe 方案
            document.getElementById('loading').innerHTML = '正在切换通道...';
            var iframe = document.createElement('iframe');
            iframe.src = 'https://sdk.coze.site?projectId=7639233788865970182&token=pat_SFfNrsqAZcodFqD7ctzRkoYbL6DKWQmItCeAbaHyLO8zfLm1H5HkaanOgG6F08bL';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            document.getElementById('sdk-container').appendChild(iframe);
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>
</html>
