<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>浮梦</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; background: #f5f5f5; }
        #sdk-container { width: 100%; height: 100%; }
        .loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #999;
            font-size: 16px;
            gap: 16px;
        }
        .loading .dot {
            animation: blink 1.4s infinite both;
        }
        .loading .dot:nth-child(2) { animation-delay: 0.2s; }
        .loading .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
        .error-panel {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #666;
            font-size: 16px;
            gap: 20px;
            padding: 40px;
            text-align: center;
        }
        .error-panel .emoji { font-size: 48px; }
        .error-panel .msg { color: #999; font-size: 14px; line-height: 1.6; }
        .retry-btn {
            padding: 12px 32px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .retry-btn:active { background: #3a7bc8; }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        浮梦正在苏醒<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
    <div id="sdk-container"></div>
    <div class="error-panel" id="error-panel">
        <div class="emoji">💤</div>
        <div>浮梦走丢了</div>
        <div class="msg">可能是网络断了或者服务暂时不可用</div>
        <button class="retry-btn" onclick="location.reload()">重新连接</button>
    </div>

    <script src="https://lf-cdn.coze.cn/obj/unpkg/latest/coze/web-sdk/dist/js-umd/index.min.js"></script>
    <script>
        var PAT = 'pat_SFfNrsqAZcodFqD7ctzRkoYbL6DKWQmItCeAbaHyLO8zfLm1H5HkaanOgG6F08bL';
        var PROJECT_ID = '7639233788865970182';
        var initSuccess = false;

        function initSDK() {
            try {
                document.getElementById('loading').style.display = 'flex';
                document.getElementById('error-panel').style.display = 'none';
                document.getElementById('sdk-container').innerHTML = '';

                cozeWebSDK.init({
                    projectId: PROJECT_ID,
                    refreshToken: function() { return PAT; },
                    container: document.getElementById('sdk-container'),
                });

                initSuccess = true;

                // 加载成功后隐藏 loading
                setTimeout(function() {
                    document.getElementById('loading').style.display = 'none';
                }, 3000);

                // 5 分钟后如果还在 loading，判定为失败
                setTimeout(function() {
                    if (!initSuccess || document.getElementById('loading').style.display !== 'none') {
                        showError();
                    }
                }, 300000);

            } catch(e) {
                showError();
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('sdk-container').innerHTML = '';
            document.getElementById('error-panel').style.display = 'flex';
        }

        // 初始化
        initSDK();

        // 切回前台时重新连接
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && initSuccess) {
                // 检查 SDK 容器是否还活着
                var container = document.getElementById('sdk-container');
                if (!container.innerHTML || container.innerHTML.trim() === '') {
                    initSDK();
                }
            }
        });

        // 网络恢复时重试
        window.addEventListener('online', function() {
            initSDK();
        });

        // 网络断开时提示
        window.addEventListener('offline', function() {
            showError();
        });
    </script>
</body>
</html>
